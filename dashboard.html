<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="dashboard">

        <div class="top-bar">

            <div>

    <h1>Mi Blog</h1>

    <p id="welcomeUser"></p>

</div>

            <button id="logoutBtn">
                Cerrar Sesión
            </button>

        </div>

        <div class="post-form">

            <h2>Crear Publicación</h2>

            <form id="postForm">

                <input 
                    type="text" 
                    id="title" 
                    placeholder="Título"
                    required
                >

                <textarea 
                    id="content"
                    placeholder="Contenido"
                    required
                ></textarea>

                <button type="submit">
                    Publicar
                </button>

            </form>

        </div>

        <div class="posts-container">

            <h2>Publicaciones</h2>

            <div id="postsList"></div>

        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/blog.js"></script>

</body>
</html>
